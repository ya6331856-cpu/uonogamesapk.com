name: Autonated SEO & API Health Pipeline

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth requests google-generativeai beautifulsoup4

      - name: Run API Health Check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: python health_check.py

      - name: Run Main GSC Report Automation
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python gsc_report.py

      - name: Generate Sitemap
        run: python generate_sitemap.py

      - name: Ping Search Engines
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://www.uonogamesapk.com/sitemap.xml"
          curl -s "https://www.bing.com/ping?sitemap=https://www.uonogamesapk.com/sitemap.xml"

      - name: Run Broken Link Checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_links.py

      - name: Monitor Website Speed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_speed.py

      - name: Run Security Vulnerability Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python security_scan.py

      - name: Run Sitemap & Feed Validator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python indexing_and_validator.py

      - name: Run Broken Image Checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_images.py

      - name: Commit and Push All Changes
        run: |
          git config --global user.name GitHubActionBot
          git config --global user.email action@github.com
          git add .
          if ! git diff --quiet || ! git diff --cached --quiet; then
            git commit -m auto-update-seo-reports
          fi
          success=0
          for i in 1 2 3 4 5; do
            git fetch origin
            if git rebase origin/$(git branch --show-current); then
              success=1
              break
            fi
            git rebase --abort
            echo Rebase failed retrying
            sleep 5
          done
          git push origin HEAD:$(git branch --show-current)

      - name: Run Keyword Gap Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python keyword_gap_monitor.py
