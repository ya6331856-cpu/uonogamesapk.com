name: Automated SEO & API Health Pipeline

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth requests google-generativeai beautifulsoup4

      - name: Run API Health Check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: python health_check.py

      - name: Run Main GSC Report Automation
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python gsc_report.py

      - name: Generate Sitemap
        run: python generate_sitemap.py

      - name: Ping Search Engines
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://www.uonogamesapk.com/sitemap.xml"
          curl -s "https://www.bing.com/ping?sitemap=https://www.uonogamesapk.com/sitemap.xml"

      - name: Run Broken Link Checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_links.py

      - name: Monitor Website Speed
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_speed.py

      - name: Commit and Push All Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add .
          git diff --quiet && git diff --cached --quiet || (git commit -m "chore: auto-update sitemap, speed check and SEO reports [skip ci]" && git push)
      - name: Install Dependencies
        run: |
          pip install google-api-python-client google-auth requests google-generativeai beautifulsoup4 safety
          
