name: AI SEO Guardian

on:
  schedule:
    - cron: '0 */6 * * *' # Yeh 24/7 non-stop har 6 ghante mein automatically run hoga
  workflow_dispatch: # Isse aap manually bhi run kar sakte hain

jobs:
  seo-audit-and-optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-generativeai

      - name: Run GSC Intelligence Analyzer & Auto-Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
        run: |
          python scripts/seo_gsc_analyzer.py

      - name: Commit SEO Reports & Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "AI SEO Guardian: 24/7 Automated 100% SEO Optimization & Publishing [skip ci]"
          branch: main
