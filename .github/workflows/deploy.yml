name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ main, master, fix/appmanager-useEffect ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Build
        working-directory: ./frontend
        run: |
          yarn install --ignore-engines
          yarn --ignore-engines build

      - name: Deploy to Cloudflare Pages via Wrangler
        run: npx wrangler pages deploy frontend/build --project-name=newyonogames --account-id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
