name: Daily Keyword Rank Tracker

on:
  schedule:
    - cron: '0 8 * * *' # Roz subah 8:00 AM UTC par run hoga
  workflow_dispatch: # Aap ise manually bhi Run workflow button se chala sakte hain

jobs:
  track-keywords:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Keyword Tracker Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python automations/keyword_rank_tracker.py
