name: Blog Post Automation

on:
  schedule:
    - cron: '0 0 * * *'  # Roz raat ko 12 baje chalega
  workflow_dispatch:     # Aap ise manually bhi run kar sakte hain

jobs:
  run-blog-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Taaki script files ko update/commit kar sake
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-generativeai

      - name: Run Blog Optimizer
        run: python blog_optimizer.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add completed_blogs.txt generated_blogs.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update blog content" && git push)
