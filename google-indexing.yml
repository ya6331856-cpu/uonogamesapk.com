name: Google Indexing API - Batch Submit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  indexing:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install google-auth requests

    - name: Run Batch Indexing Script
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
      run: |
        python -c '
        import os
        import json
        import urllib.request
        import xml.etree.ElementTree as ET
        from google.oauth2 import service_account
        from google.auth.transport.requests import Request
        import requests

        credentials_info = json.loads(os.environ["GOOGLE_CREDENTIALS"])
        credentials = service_account.Credentials.from_service_account_info(
            credentials_info, scopes=["https://www.googleapis.com/auth/indexing"]
        )
        request = Request()
        credentials.refresh(request)
        token = credentials.token

        sitemap_url = "https://uonogamesapk.com/sitemap.xml"
        print(f"Fetching sitemap from {sitemap_url}")
        
        req = urllib.request.Request(sitemap_url, headers={"User-Agent": "Mozilla/5.0"})
        try:
            xml_data = urllib.request.urlopen(req).read()
            root = ET.fromstring(xml_data)
            
            ns = {"ns": "http://www.sitemaps.org/schemas/sitemap/0.9"}
            urls = [elem.text for elem in root.findall(".//ns:loc", ns)]
            
            if not urls:
                urls = [elem.text for elem in root.findall(".//loc")]

            print(f"Found {len(urls)} URLs in sitemap.")

            endpoint = "https://indexing.googleapis.com/v3/urlNotifications:publish"
            
            for url in urls:
                headers = {
                    "Content-Type": "application/json",
                    "Authorization": f"Bearer {token}"
                }
                body = {
                    "url": url,
                    "type": "URL_UPDATED"
                }
                response = requests.post(endpoint, headers=headers, json=body)
                print(f"URL: {url} -> Status: {response.status_code}")
                
        except Exception as e:
            print("Error reading sitemap or submitting URLs:", str(e))
        '
